name: Deploy pwa-gastos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pwa-gastos/**'
      - '.github/workflows/deploy-pwa-gastos.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa-gastos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa-gastos/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          # Client ID de un App Registration publico -- no es secreto,
          # se hardcodea en vez de pedir una variable de repo extra.
          VITE_MSAL_CLIENT_ID: 333e6f11-ba22-49eb-9574-e0ce7d646b84

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa-gastos/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
